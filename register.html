<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IMFP-IGP Seminar — Speaker Submission</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="IMFP-IGP Logo" class="logo">
    <h1>IMFP-IGP Seminar</h1>
    <nav>
      <a href="index.html">About</a>
      <a href="location.html">Location</a>
      <a href="organizers.html">Organizers</a>
      <a href="upcoming.html">Upcoming Seminars</a>
      <a href="past.html">Past Seminars</a>
    </nav>
  </header>

  <main>
    <section id="register">
      <h2>Speaker Submission</h2>
      <div class="notice">
        <p>Registration and abstract submission are now combined into one self-service form. Your seminar information will be checked and published automatically.</p>
      </div>
      <a id="continue-link" class="button-link" href="submit-abstract.html">Continue to the submission form</a>
    </section>
  </main>

  <script>
    const date = new URLSearchParams(window.location.search).get('date');
    if (date) {
      const url = new URL('submit-abstract.html', window.location.href);
      url.searchParams.set('date', date);
      document.getElementById('continue-link').href = url.toString();
    }
  </script>
</body>
</html>
