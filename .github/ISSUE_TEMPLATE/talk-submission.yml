name: Submit a seminar talk
description: Reserve an available date and publish your title and abstract.
title: "Seminar booking record (leave unchanged)"
labels:
  - talk-submission
body:
  - type: markdown
    attributes:
      value: |
        Thank you for speaking at the IMFP-IGP Seminar. The information below (except this instruction) will be displayed publicly after an automatic validation check.

        Please choose a date that is currently marked **Available slot** on the seminar website. Do not include private contact information in this form.

        **About “Add a title” above:** GitHub requires a title for this submission record. It is pre-filled for you and is **not** the title shown on the seminar website. Please leave it as it is. Enter your actual presentation title in **Talk title** below.

        If you need to correct anything later, edit the description of this same GitHub issue. The website will update automatically; you do not need to submit a second issue.

  - type: input
    id: seminar-date
    attributes:
      label: Seminar date
      description: Use the exact date shown on the Upcoming Seminars page, for example, September 24, 2026.
      placeholder: Month D, YYYY
    validations:
      required: true

  - type: input
    id: speaker-name
    attributes:
      label: Speaker name
      placeholder: Full name
    validations:
      required: true

  - type: input
    id: institution
    attributes:
      label: Institution or affiliation
      placeholder: University or institution
    validations:
      required: true

  - type: input
    id: personal-page
    attributes:
      label: Personal or professional webpage
      description: Optional. Enter only a full http:// or https:// URL; leave this blank if you do not have one. Do not put your talk title here.
      placeholder: https://example.edu/~speaker/
    validations:
      required: false

  - type: textarea
    id: talk-title
    attributes:
      label: Talk title
      description: This is the presentation title that appears on the seminar website; the GitHub issue title above is only a booking label.
      placeholder: Title of your talk (LaTeX math is welcome)
    validations:
      required: true

  - type: textarea
    id: talk-abstract
    attributes:
      label: Talk abstract
      description: Use $...$ or \(...\) for inline LaTeX math and $$...$$ or \[...\] for display math. The website will typeset these formulas automatically.
      placeholder: Please enter your abstract here.
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I am an invited speaker (or am submitting with an organizer's permission), and I understand that these seminar details will be public.
          required: true
